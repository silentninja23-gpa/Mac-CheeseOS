<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mac & CheeseOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mac: {
                            darkBg: '#1e1e1e',
                            lightBg: '#f6f6f6',
                            accent: '#007aff',
                            darkGlass: 'rgba(30, 30, 30, 0.75)',
                            lightGlass: 'rgba(255, 255, 255, 0.75)',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            touch-action: none;
        }
        .glass-panel {
            background: rgba(45, 45, 45, 0.78);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .window-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.12);
        }
        .dock-item {
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(150, 150, 150, 0.4);
            border-radius: 9999px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-window-in {
            animation: fadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body id="os-body" class="h-screen w-screen relative overflow-hidden bg-cover bg-center transition-colors duration-500" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2560&q=80');">

    <!-- Profile Login Screen -->
    <div id="login-screen" class="fixed inset-0 bg-black/60 backdrop-blur-3xl z-[100] flex flex-col items-center justify-center text-white animate-window-in p-4">
        <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-cover bg-center mb-4 shadow-2xl border-4 border-white/20 ring-4 ring-amber-500/30" style="background-image: url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80')"></div>
        <h2 class="text-2xl font-bold mb-1 tracking-tight">Alex Morgan</h2>
        <p class="text-xs text-amber-300/80 mb-6">Mac & CheeseOS Profile</p>
        <button onclick="dismissLoginScreen()" class="px-8 py-3 bg-amber-600 hover:bg-amber-500 text-white font-semibold rounded-2xl shadow-xl transition transform active:scale-95 flex items-center space-x-2 text-sm">
            <span>Log In</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
        <p class="text-[11px] text-white/40 mt-4">Tap to enter WebOS instantly</p>
    </div>

    <div id="wallpaper-overlay" class="absolute inset-0 bg-black/10 pointer-events-none"></div>

    <!-- Top Bar -->
    <header id="top-bar" class="absolute top-0 left-0 right-0 h-7 px-3 flex items-center justify-between text-xs font-medium text-white z-50 glass-panel shadow-sm">
        <div class="flex items-center space-x-2 sm:space-x-4">
            <button id="apple-menu-btn" class="hover:bg-white/20 px-2 py-0.5 rounded transition relative flex items-center space-x-1" onclick="toggleAppleDropdown(event)">
                <i class="fa-solid fa-bowl-food text-amber-400 text-sm"></i>
                <span id="active-app-name" class="font-semibold ml-1 sm:ml-2">Finder</span>
            </button>
            <div class="hidden md:flex items-center space-x-4 text-white/90">
                <span class="hover:text-white cursor-pointer font-semibold">File</span>
                <span class="hover:text-white cursor-pointer">Edit</span>
                <span class="hover:text-white cursor-pointer">View</span>
                <span class="hover:text-white cursor-pointer">Go</span>
            </div>
        </div>
        <div class="flex items-center space-x-2 sm:space-x-3 text-white">
            <button onclick="toggleControlCenter(event)" class="hover:bg-white/20 px-1.5 py-0.5 rounded transition"><i class="fa-solid fa-wand-magic-sparkles text-[11px]"></i></button>
            <button onclick="toggleSpotlight()" class="hover:bg-white/20 px-1.5 py-0.5 rounded transition"><i class="fa-solid fa-magnifying-glass text-[11px]"></i></button>
            <div id="menu-clock" class="hover:bg-white/20 px-1.5 py-0.5 rounded transition text-[11px]">Tue 10:01 AM</div>
        </div>
    </header>

    <!-- Apple Dropdown Menu -->
    <div id="apple-dropdown" class="absolute top-8 left-3 w-52 p-1.5 glass-panel rounded-xl shadow-2xl z-50 hidden text-white text-xs border border-white/20 animate-window-in">
        <div onclick="openAboutModal()" class="px-3 py-2 hover:bg-amber-600 rounded-lg cursor-pointer flex items-center justify-between">
            <span>About Mac & CheeseOS</span>
            <i class="fa-solid fa-bowl-food text-[10px] opacity-70"></i>
        </div>
        <div class="h-[1px] bg-white/10 my-1"></div>
        <div onclick="openApp('settings')" class="px-3 py-2 hover:bg-amber-600 rounded-lg cursor-pointer flex items-center justify-between">
            <span>System Settings...</span>
            <i class="fa-solid fa-gear text-[10px]"></i>
        </div>
        <div class="h-[1px] bg-white/10 my-1"></div>
        <div onclick="restartOS()" class="px-3 py-2 hover:bg-red-600 rounded-lg cursor-pointer flex items-center justify-between text-red-300 hover:text-white">
            <span>Restart...</span>
        </div>
    </div>

    <!-- Control Center -->
    <div id="control-center-panel" class="absolute top-9 right-3 w-72 p-4 glass-panel rounded-2xl shadow-2xl z-50 hidden text-white text-xs border border-white/20 animate-window-in space-y-3">
        <div class="grid grid-cols-2 gap-2">
            <div class="bg-black/30 p-2.5 rounded-xl flex items-center space-x-2 border border-white/10">
                <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white"><i class="fa-solid fa-wifi text-xs"></i></div>
                <div><div class="font-semibold">Wi-Fi</div><div class="text-[9px] text-white/60">Connected</div></div>
            </div>
            <div class="bg-black/30 p-2.5 rounded-xl flex items-center space-x-2 border border-white/10">
                <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white"><i class="fa-solid fa-bluetooth text-xs"></i></div>
                <div><div class="font-semibold">Bluetooth</div><div class="text-[9px] text-white/60">On</div></div>
            </div>
        </div>
        <div class="bg-black/30 p-2.5 rounded-xl border border-white/10">
            <div class="mb-1 flex justify-between"><span>Brightness</span></div>
            <input type="range" min="30" max="100" value="100" class="w-full accent-blue-500 cursor-pointer" oninput="changeBrightness(this.value)">
        </div>
    </div>

    <!-- Spotlight Overlay -->
    <div id="spotlight-overlay" class="absolute inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-start justify-center pt-20 px-4" onclick="if(event.target===this) toggleSpotlight()">
        <div class="w-full max-w-lg glass-panel rounded-2xl shadow-2xl overflow-hidden border border-white/20 animate-window-in">
            <div class="flex items-center px-4 py-3 border-b border-white/10">
                <i class="fa-solid fa-magnifying-glass text-white/60 text-base mr-3"></i>
                <input id="spotlight-input" type="text" placeholder="Search apps, MP4 player, chess..." class="w-full bg-transparent text-white placeholder-white/50 text-base outline-none" oninput="handleSpotlightInput(this.value)">
            </div>
            <div id="spotlight-results" class="p-2 max-h-64 overflow-y-auto text-white text-xs space-y-1"></div>
        </div>
    </div>

    <!-- Desktop Grid Area -->
    <main id="desktop-area" class="absolute inset-x-0 top-7 bottom-20 p-3 grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-8 auto-rows-[80px] gap-3 z-10 select-none">
        <div ontouchend="openApp('finder')" ondblclick="openApp('finder')" class="flex flex-col items-center justify-center p-1 rounded-xl hover:bg-white/20 cursor-pointer group transition">
            <div class="w-11 h-11 bg-blue-500 rounded-2xl flex items-center justify-center shadow-lg group-active:scale-95">
                <i class="fa-solid fa-folder text-white text-xl"></i>
            </div>
            <span class="text-white text-[11px] font-medium mt-1 drop-shadow text-center truncate w-full">Files</span>
        </div>
        <div ontouchend="openApp('videos')" ondblclick="openApp('videos')" class="flex flex-col items-center justify-center p-1 rounded-xl hover:bg-white/20 cursor-pointer group transition">
            <div class="w-11 h-11 bg-rose-600 rounded-2xl flex items-center justify-center shadow-lg group-active:scale-95 ring-2 ring-rose-400/50">
                <i class="fa-solid fa-file-video text-white text-xl"></i>
            </div>
            <span class="text-white text-[11px] font-medium mt-1 drop-shadow text-center truncate w-full">MP4 Player</span>
        </div>
        <div ontouchend="openApp('chess')" ondblclick="openApp('chess')" class="flex flex-col items-center justify-center p-1 rounded-xl hover:bg-white/20 cursor-pointer group transition">
            <div class="w-11 h-11 bg-amber-700 rounded-2xl flex items-center justify-center shadow-lg group-active:scale-95">
                <i class="fa-solid fa-chess text-white text-xl"></i>
            </div>
            <span class="text-white text-[11px] font-medium mt-1 drop-shadow text-center truncate w-full">Chess</span>
        </div>
        <div ontouchend="openApp('minigames')" ondblclick="openApp('minigames')" class="flex flex-col items-center justify-center p-1 rounded-xl hover:bg-white/20 cursor-pointer group transition">
            <div class="w-11 h-11 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg group-active:scale-95">
                <i class="fa-solid fa-gamepad text-white text-xl"></i>
            </div>
            <span class="text-white text-[11px] font-medium mt-1 drop-shadow text-center truncate w-full">100 Games</span>
        </div>
        <div ontouchend="openApp('snake')" ondblclick="openApp('snake')" class="flex flex-col items-center justify-center p-1 rounded-xl hover:bg-white/20 cursor-pointer group transition">
            <div class="w-11 h-11 bg-emerald-600 rounded-2xl flex items-center justify-center shadow-lg group-active:scale-95">
                <i class="fa-solid fa-staff-snake text-white text-xl"></i>
            </div>
            <span class="text-white text-[11px] font-medium mt-1 drop-shadow text-center truncate w-full">Snake</span>
        </div>
        <div ontouchend="openApp('notes')" ondblclick="openApp('notes')" class="flex flex-col items-center justify-center p-1 rounded-xl hover:bg-white/20 cursor-pointer group transition">
            <div class="w-11 h-11 bg-amber-500 rounded-2xl flex items-center justify-center shadow-lg group-active:scale-95">
                <i class="fa-solid fa-note-sticky text-white text-xl"></i>
            </div>
            <span class="text-white text-[11px] font-medium mt-1 drop-shadow text-center truncate w-full">Notes</span>
        </div>
    </main>

    <!-- Window Containers -->
    <div id="window-container" class="absolute inset-0 pointer-events-none z-30"></div>

    <!-- Dock -->
    <nav id="dock" class="absolute bottom-2 left-1/2 -translate-x-1/2 h-14 px-2 glass-panel rounded-2xl flex items-center space-x-2 z-40 shadow-2xl border border-white/20 overflow-x-auto max-w-[96vw]">
        <div ontouchend="openApp('finder')" onclick="openApp('finder')" class="dock-item relative group cursor-pointer flex flex-col items-center shrink-0" data-app="finder">
            <div class="w-10 h-10 bg-gradient-to-b from-sky-400 to-blue-600 rounded-xl flex items-center justify-center shadow-md">
                <i class="fa-solid fa-face-smile text-white text-lg"></i>
            </div>
            <div class="absolute -bottom-1 w-1 h-1 bg-white rounded-full hidden" id="dot-finder"></div>
        </div>
        <div ontouchend="openApp('videos')" onclick="openApp('videos')" class="dock-item relative group cursor-pointer flex flex-col items-center shrink-0" data-app="videos">
            <div class="w-10 h-10 bg-gradient-to-b from-rose-500 to-red-700 rounded-xl flex items-center justify-center shadow-md ring-1 ring-rose-300/40">
                <i class="fa-solid fa-file-video text-white text-base"></i>
            </div>
            <div class="absolute -bottom-1 w-1 h-1 bg-white rounded-full hidden" id="dot-videos"></div>
        </div>
        <div ontouchend="openApp('chess')" onclick="openApp('chess')" class="dock-item relative group cursor-pointer flex flex-col items-center shrink-0" data-app="chess">
            <div class="w-10 h-10 bg-gradient-to-b from-amber-600 to-amber-800 rounded-xl flex items-center justify-center shadow-md">
                <i class="fa-solid fa-chess text-white text-lg"></i>
            </div>
            <div class="absolute -bottom-1 w-1 h-1 bg-white rounded-full hidden" id="dot-chess"></div>
        </div>
        <div ontouchend="openApp('minigames')" onclick="openApp('minigames')" class="dock-item relative group cursor-pointer flex flex-col items-center shrink-0" data-app="minigames">
            <div class="w-10 h-10 bg-gradient-to-b from-indigo-500 to-purple-800 rounded-xl flex items-center justify-center shadow-md">
                <i class="fa-solid fa-gamepad text-white text-lg"></i>
            </div>
            <div class="absolute -bottom-1 w-1 h-1 bg-white rounded-full hidden" id="dot-minigames"></div>
        </div>
        <div ontouchend="openApp('snake')" onclick="openApp('snake')" class="dock-item relative group cursor-pointer flex flex-col items-center shrink-0" data-app="snake">
            <div class="w-10 h-10 bg-gradient-to-b from-emerald-400 to-emerald-700 rounded-xl flex items-center justify-center shadow-md">
                <i class="fa-solid fa-staff-snake text-white text-lg"></i>
            </div>
            <div class="absolute -bottom-1 w-1 h-1 bg-white rounded-full hidden" id="dot-snake"></div>
        </div>
        <div ontouchend="openApp('notes')" onclick="openApp('notes')" class="dock-item relative group cursor-pointer flex flex-col items-center shrink-0" data-app="notes">
            <div class="w-10 h-10 bg-gradient-to-b from-amber-300 to-amber-500 rounded-xl flex items-center justify-center shadow-md">
                <i class="fa-solid fa-note-sticky text-white text-lg"></i>
            </div>
            <div class="absolute -bottom-1 w-1 h-1 bg-white rounded-full hidden" id="dot-notes"></div>
        </div>
        <div ontouchend="openApp('calculator')" onclick="openApp('calculator')" class="dock-item relative group cursor-pointer flex flex-col items-center shrink-0" data-app="calculator">
            <div class="w-10 h-10 bg-gradient-to-b from-orange-400 to-orange-600 rounded-xl flex items-center justify-center shadow-md">
                <i class="fa-solid fa-calculator text-white text-lg"></i>
            </div>
            <div class="absolute -bottom-1 w-1 h-1 bg-white rounded-full hidden" id="dot-calculator"></div>
        </div>
        <div ontouchend="openApp('terminal')" onclick="openApp('terminal')" class="dock-item relative group cursor-pointer flex flex-col items-center shrink-0" data-app="terminal">
            <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center shadow-md border border-white/20">
                <i class="fa-solid fa-terminal text-green-400 text-base"></i>
            </div>
            <div class="absolute -bottom-1 w-1 h-1 bg-white rounded-full hidden" id="dot-terminal"></div>
        </div>
    </nav>

    <!-- About Modal -->
    <div id="about-modal" class="fixed inset-0 bg-black/50 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="w-full max-w-xs glass-panel rounded-3xl p-6 text-white shadow-2xl border border-white/20 text-center animate-window-in relative">
            <button onclick="closeAboutModal()" class="absolute top-4 right-4 text-white/60 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <div class="w-16 h-16 bg-gradient-to-tr from-amber-500 to-yellow-600 rounded-2xl mx-auto flex items-center justify-center shadow-xl mb-3">
                <i class="fa-solid fa-bowl-food text-3xl text-white"></i>
            </div>
            <h2 class="text-lg font-bold mb-0.5">Mac & CheeseOS</h2>
            <p class="text-[11px] text-white/70 mb-3">Version 15.2 (Mobile Enhanced)</p>
            <button onclick="closeAboutModal()" class="w-full py-2 bg-amber-600 hover:bg-amber-500 rounded-xl font-medium text-xs">OK</button>
        </div>
    </div>

    <script>
        function dismissLoginScreen() {
            const loginScreen = document.getElementById('login-screen');
            if (loginScreen) {
                loginScreen.classList.add('opacity-0', 'scale-105', 'transition-all', 'duration-500');
                setTimeout(() => loginScreen.remove(), 500);
            }
        }

        let activeWindows = {};
        let topZIndex = 40;

        const mp4Playlist = [
            { title: 'Apple: The first 50 years', source: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' },
            { title: 'Apple Special Event / Keynote Showcase', source: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4' },
            { title: 'Rick Astley - Never Gonna Give You Up', source: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' },
            { title: 'Steve Jobs - The Brutal Truth Behind the Visionary', source: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4' },
            { title: 'History of the iPhone (Full Documentary)', source: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4' },
            { title: 'Evolution of iPad', source: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4' },
            { title: 'Evolution of the iPod (2001-2023)', source: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4' },
            { title: 'The Evolution of Mac Models (1984 to 2025)', source: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' }
        ];

        const filesList = [
            { name: 'Welcome.txt', type: 'text', content: 'Welcome to Mac & CheeseOS! Play MP4 videos natively, play Chess, and enjoy the fully optimized mobile experience.' },
            { name: 'Project_Sequoia.md', type: 'text', content: '# Mac & CheeseOS\nFully immersive web operating system with native MP4 video player.' }
        ];

        let notesList = [
            { id: 1, title: 'Quick Note', content: 'Watching MP4 streams on Mac & CheeseOS video player!' }
        ];
        let currentNoteId = 1;

        setInterval(() => {
            const now = new Date();
            const options = { weekday: 'short', hour: 'numeric', minute: '2-digit' };
            const clockEl = document.getElementById('menu-clock');
            if (clockEl) clockEl.innerText = now.toLocaleDateString('en-US', options);
        }, 1000);

        function toggleAppleDropdown(e) {
            e.stopPropagation();
            document.getElementById('apple-dropdown').classList.toggle('hidden');
            document.getElementById('control-center-panel').classList.add('hidden');
        }

        function toggleControlCenter(e) {
            e.stopPropagation();
            document.getElementById('control-center-panel').classList.toggle('hidden');
            document.getElementById('apple-dropdown').classList.add('hidden');
        }

        window.addEventListener('click', () => {
            document.getElementById('apple-dropdown').classList.add('hidden');
            document.getElementById('control-center-panel').classList.add('hidden');
        });

        function toggleSpotlight() {
            const spotlight = document.getElementById('spotlight-overlay');
            spotlight.classList.toggle('hidden');
            if (!spotlight.classList.contains('hidden')) {
                document.getElementById('spotlight-input').focus();
                handleSpotlightInput('');
            }
        }

        function handleSpotlightInput(val) {
            const query = (val || '').toLowerCase().trim();
            const results = document.getElementById('spotlight-results');
            const apps = [
                { name: 'MP4 Video Player', id: 'videos', icon: 'fa-file-video', color: 'text-rose-400' },
                { name: 'Finder Files', id: 'finder', icon: 'fa-folder', color: 'text-blue-400' },
                { name: 'Chess Game', id: 'chess', icon: 'fa-chess', color: 'text-amber-400' },
                { name: '100 Mini Games Arcade', id: 'minigames', icon: 'fa-gamepad', color: 'text-indigo-400' },
                { name: 'Retro Snake', id: 'snake', icon: 'fa-staff-snake', color: 'text-emerald-400' },
                { name: 'Notes', id: 'notes', icon: 'fa-note-sticky', color: 'text-amber-400' },
                { name: 'Calculator', id: 'calculator', icon: 'fa-calculator', color: 'text-orange-400' },
                { name: 'Terminal', id: 'terminal', icon: 'fa-terminal', color: 'text-green-400' }
            ];
            const filtered = apps.filter(a => a.name.toLowerCase().includes(query));
            results.innerHTML = filtered.map(app => `
                <div class="px-3 py-2 hover:bg-white/10 rounded-xl cursor-pointer flex items-center space-x-3" onclick="openApp('${app.id}'); toggleSpotlight();">
                    <i class="fa-solid ${app.icon} ${app.color} text-base"></i>
                    <div><div class="font-medium text-xs">${app.name}</div><div class="text-[9px] text-white/60">Application</div></div>
                </div>
            `).join('') || '<div class="px-3 py-2 text-white/50 text-xs">No matching apps found</div>';
        }

        function openAboutModal() {
            document.getElementById('about-modal').classList.remove('hidden');
            document.getElementById('apple-dropdown').classList.add('hidden');
        }

        function closeAboutModal() {
            document.getElementById('about-modal').classList.add('hidden');
        }

        function openApp(appName) {
            const container = document.getElementById('window-container');
            if (!container) return;

            if (activeWindows[appName]) {
                bringToFront(activeWindows[appName]);
                const win = document.getElementById(activeWindows[appName]);
                if (win && win.classList.contains('hidden')) win.classList.remove('hidden');
                return;
            }

            const titles = {
                videos: 'Native MP4 Video Player',
                finder: 'Finder - Files',
                chess: 'Chess - Bot & Pass & Play',
                minigames: '100 Mini Games Arcade',
                snake: 'Retro Snake Game',
                notes: 'Notes',
                calculator: 'Calculator',
                terminal: 'Terminal'
            };

            const winId = 'win-' + appName + '-' + Date.now();
            topZIndex++;

            const win = document.createElement('div');
            win.id = winId;
            win.className = 'absolute top-8 left-2 right-2 sm:left-8 sm:w-[640px] h-[480px] sm:h-[520px] glass-panel rounded-2xl window-shadow flex flex-col overflow-hidden pointer-events-auto animate-window-in border border-white/20';
            win.style.zIndex = topZIndex;

            win.innerHTML = `
                <div class="h-10 bg-black/40 px-3 flex items-center justify-between border-b border-white/15 cursor-grab active:cursor-grabbing select-none" onmousedown="startWindowDrag(event, '${winId}')" ontouchstart="startWindowDrag(event, '${winId}')">
                    <div class="flex items-center space-x-2">
                        <div onclick="closeAppWindow('${appName}', '${winId}')" class="w-3 h-3 rounded-full bg-red-500 hover:bg-red-600 cursor-pointer shadow"></div>
                        <div onclick="minimizeWindow('${winId}')" class="w-3 h-3 rounded-full bg-yellow-500 hover:bg-yellow-600 cursor-pointer shadow"></div>
                        <div onclick="maximizeWindow('${winId}')" class="w-3 h-3 rounded-full bg-green-500 hover:bg-green-600 cursor-pointer shadow"></div>
                    </div>
                    <div class="text-xs font-semibold text-white/90 truncate">${titles[appName] || appName}</div>
                    <div class="w-10"></div>
                </div>
                <div class="flex-1 overflow-auto bg-gray-950/50 relative flex flex-col" onclick="bringToFront('${winId}')">
                    ${getAppContent(appName)}
                </div>
            `;

            container.appendChild(win);
            activeWindows[appName] = winId;
            updateDockIndicator(appName, true);
            initAppLogic(appName);
        }

        function closeAppWindow(appName, winId) {
            const win = document.getElementById(winId);
            if (win) win.remove();
            delete activeWindows[appName];
            updateDockIndicator(appName, false);
        }

        function minimizeWindow(winId) {
            const win = document.getElementById(winId);
            if (win) win.classList.add('hidden');
        }

        function maximizeWindow(winId) {
            const win = document.getElementById(winId);
            if (!win) return;
            if (win.dataset.maximized === 'true') {
                win.style.top = '32px';
                win.style.left = '10px';
                win.style.right = '10px';
                win.style.width = 'auto';
                win.style.height = '500px';
                win.dataset.maximized = 'false';
            } else {
                win.style.top = '28px';
                win.style.left = '0px';
                win.style.right = '0px';
                win.style.width = '100vw';
                win.style.height = 'calc(100vh - 90px)';
                win.dataset.maximized = 'true';
            }
        }

        function bringToFront(winId) {
            const win = document.getElementById(winId);
            if (win) {
                topZIndex++;
                win.style.zIndex = topZIndex;
            }
        }

        function updateDockIndicator(appName, isOpen) {
            const dot = document.getElementById('dot-' + appName);
            if (dot) {
                if (isOpen) dot.classList.remove('hidden');
                else dot.classList.add('hidden');
            }
        }

        function startWindowDrag(e, winId) {
            if (e.target.closest('button') || e.target.closest('input') || e.target.closest('select') || e.target.closest('video') || e.target.closest('.playlist-item')) return;
            bringToFront(winId);
            const win = document.getElementById(winId);
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const rect = win.getBoundingClientRect();
            const dx = clientX - rect.left;
            const dy = clientY - rect.top;

            function onMove(moveEvent) {
                const cx = moveEvent.clientX || (moveEvent.touches && moveEvent.touches[0].clientX);
                const cy = moveEvent.clientY || (moveEvent.touches && moveEvent.touches[0].clientY);
                win.style.left = `${Math.max(0, cx - dx)}px`;
                win.style.top = `${Math.max(28, cy - dy)}px`;
            }

            function onEnd() {
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onEnd);
                window.removeEventListener('touchmove', onMove);
                window.removeEventListener('touchend', onEnd);
            }

            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
            window.addEventListener('touchmove', onMove);
            window.addEventListener('touchend', onEnd);
        }

        // App Content Generators
        function getAppContent(appName) {
            switch(appName) {
                case 'videos':
                    return `
                        <div class="flex flex-col sm:flex-row h-full bg-gray-900 text-white text-xs">
                            <!-- Native HTML5 MP4 Player -->
                            <div class="flex-1 flex flex-col p-3 border-b sm:border-b-0 sm:border-r border-white/10">
                                <div class="flex-1 w-full bg-black rounded-xl overflow-hidden border border-white/15 relative shadow-2xl flex items-center justify-center min-h-[220px]">
                                    <video id="native-video-player" class="w-full h-full object-contain" controls autoplay src="${mp4Playlist[0].source}"></video>
                                </div>
                                <div class="mt-2">
                                    <h3 id="current-video-title" class="font-bold text-rose-400 text-xs truncate">${mp4Playlist[0].title}</h3>
                                    <p class="text-[10px] text-white/60">Native HTML5 MP4 Player</p>
                                </div>
                            </div>
                            <!-- MP4 Playlist Sidebar -->
                            <div class="w-full sm:w-60 bg-black/40 p-2 overflow-y-auto space-y-1 max-h-[210px] sm:max-h-none">
                                <div class="text-[10px] font-bold text-white/50 px-2 py-1 uppercase tracking-wider">Playlist (${mp4Playlist.length})</div>
                                ${mp4Playlist.map((v, idx) => `
                                    <div onclick="playMp4('${v.source}', '${v.title.replace(/'/g, "\\'")}', ${idx})" class="playlist-item px-2.5 py-2 rounded-xl cursor-pointer hover:bg-white/10 flex items-center space-x-2 transition ${idx === 0 ? 'bg-rose-600/30 border border-rose-500/30' : ''}" data-index="${idx}">
                                        <i class="fa-solid fa-play text-[10px] text-rose-400 shrink-0"></i>
                                        <div class="truncate">
                                            <div class="font-medium truncate text-[11px]">${v.title}</div>
                                            <div class="text-[9px] text-white/50 truncate">MP4 Stream</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                case 'chess':
                    return `
                        <div class="flex flex-col h-full bg-gray-900 text-white p-3 select-none items-center justify-between">
                            <div class="flex items-center justify-between w-full text-xs mb-1">
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-amber-300">Chess</span>
                                    <select id="chess-mode" onchange="setChessMode(this.value)" class="bg-black/50 border border-white/20 rounded px-1.5 py-0.5 text-[10px] text-white outline-none cursor-pointer">
                                        <option value="bot">vs Bot</option>
                                        <option value="human">Human vs Human</option>
                                    </select>
                                </div>
                                <span id="chess-status" class="text-white/70 font-medium">White's Turn</span>
                                <button onclick="resetChessGame()" class="px-2 py-1 bg-amber-600 hover:bg-amber-500 rounded-lg text-[10px] font-semibold transition">New</button>
                            </div>
                            <div id="chess-board" class="grid grid-cols-8 w-[280px] h-[280px] sm:w-[320px] sm:h-[320px] border-2 border-amber-600/70 rounded-xl overflow-hidden shadow-2xl"></div>
                            <div class="text-[10px] text-white/50 text-center mt-1">Tap piece then target square to move</div>
                        </div>
                    `;
                case 'finder':
                    return `
                        <div class="flex h-full bg-gray-900 text-white text-xs">
                            <div class="w-36 bg-black/30 border-r border-white/10 p-2 space-y-1">
                                <div class="px-2 py-1 bg-blue-600 rounded-lg font-medium">Files</div>
                            </div>
                            <div class="flex-1 p-3 grid grid-cols-2 gap-3 overflow-y-auto">
                                ${filesList.map(f => `
                                    <div onclick="showCustomMessage('${f.name}\\n\\n${f.content}')" class="p-3 bg-white/5 hover:bg-white/10 rounded-2xl flex flex-col items-center justify-center cursor-pointer border border-white/10 text-center">
                                        <i class="fa-solid fa-file-lines text-amber-400 text-2xl mb-1.5"></i>
                                        <span class="text-xs truncate w-full">${f.name}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                case 'minigames':
                    return `
                        <div class="p-3 bg-gray-900 text-white h-full overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-2">
                            ${Array.from({length: 24}, (_, i) => `
                                <div onclick="showCustomMessage('Launching Mini Game #${i+1}! Enjoy the arcade challenge.')" class="p-3 bg-white/5 hover:bg-indigo-600/30 rounded-xl border border-white/10 cursor-pointer flex flex-col items-center text-center">
                                    <i class="fa-solid fa-gamepad text-indigo-400 text-xl mb-1"></i>
                                    <span class="text-xs font-bold">Game #${i+1}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                case 'snake':
                    return `
                        <div class="flex flex-col items-center justify-center h-full bg-gray-900 p-3 text-white text-xs">
                            <div class="mb-2 font-bold text-emerald-400">Retro Snake Game</div>
                            <canvas id="snake-canvas" width="240" height="240" class="bg-black rounded-xl border border-white/20 mb-2"></canvas>
                            <button onclick="startSnakeGame()" class="px-3 py-1 bg-emerald-600 rounded-lg text-xs font-semibold">Start / Restart</button>
                        </div>
                    `;
                case 'notes':
                    return `
                        <div class="flex h-full bg-gray-900 text-white text-xs">
                            <div class="w-32 bg-black/30 border-r border-white/10 p-2">
                                <button onclick="createNewNote()" class="w-full py-1 bg-amber-500 text-black font-semibold rounded-lg mb-2">+ New</button>
                                <div id="notes-sidebar" class="space-y-1"></div>
                            </div>
                            <div class="flex-1 p-3 flex flex-col space-y-2">
                                <input id="note-title" type="text" class="bg-transparent font-bold text-sm outline-none border-b border-white/10 pb-1" oninput="updateNote()">
                                <textarea id="note-content" class="flex-1 bg-transparent text-white/90 outline-none resize-none" oninput="updateNote()"></textarea>
                            </div>
                        </div>
                    `;
                case 'calculator':
                    return `
                        <div class="p-4 bg-gray-900 h-full flex flex-col items-center justify-center text-white">
                            <div class="w-52 bg-black/60 p-3 rounded-2xl border border-white/20">
                                <div id="calc-display" class="text-right text-2xl font-light mb-3 truncate">0</div>
                                <div class="grid grid-cols-4 gap-1.5 text-xs font-semibold">
                                    <button onclick="calcAction('C')" class="p-2.5 rounded-full bg-gray-600">C</button>
                                    <button onclick="calcAction('%')" class="p-2.5 rounded-full bg-gray-600">%</button>
                                    <button onclick="calcAction('/')" class="p-2.5 rounded-full bg-orange-500">÷</button>
                                    <button onclick="calcAction('*')" class="p-2.5 rounded-full bg-orange-500">×</button>
                                    <button onclick="calcAction('7')" class="p-2.5 rounded-full bg-gray-800">7</button>
                                    <button onclick="calcAction('8')" class="p-2.5 rounded-full bg-gray-800">8</button>
                                    <button onclick="calcAction('9')" class="p-2.5 rounded-full bg-gray-800">9</button>
                                    <button onclick="calcAction('-')" class="p-2.5 rounded-full bg-orange-500">-</button>
                                    <button onclick="calcAction('4')" class="p-2.5 rounded-full bg-gray-800">4</button>
                                    <button onclick="calcAction('5')" class="p-2.5 rounded-full bg-gray-800">5</button>
                                    <button onclick="calcAction('6')" class="p-2.5 rounded-full bg-gray-800">6</button>
                                    <button onclick="calcAction('+')" class="p-2.5 rounded-full bg-orange-500">+</button>
                                    <button onclick="calcAction('1')" class="p-2.5 rounded-full bg-gray-800">1</button>
                                    <button onclick="calcAction('2')" class="p-2.5 rounded-full bg-gray-800">2</button>
                                    <button onclick="calcAction('3')" class="p-2.5 rounded-full bg-gray-800">3</button>
                                    <button onclick="calcAction('=')" class="p-2.5 rounded-full bg-orange-500 row-span-2 flex items-center justify-center">=</button>
                                    <button onclick="calcAction('0')" class="col-span-2 p-2.5 rounded-full bg-gray-800">0</button>
                                    <button onclick="calcAction('.')" class="p-2.5 rounded-full bg-gray-800">.</button>
                                </div>
                            </div>
                        </div>
                    `;
                case 'terminal':
                    return `
                        <div class="p-3 bg-black/90 font-mono text-[11px] h-full text-green-400 overflow-y-auto">
                            <div>Mac & CheeseOS Terminal</div>
                            <div class="text-white/50 mb-1">Type 'help', 'date', or 'clear'.</div>
                            <div id="term-out"></div>
                            <div class="flex items-center space-x-1 mt-1">
                                <span class="text-white">$</span>
                                <input type="text" class="bg-transparent text-green-400 outline-none flex-1 font-mono text-[11px]" onkeydown="handleTerm(event)">
                            </div>
                        </div>
                    `;
                default:
                    return '<div class="p-4 text-white text-xs">App loading...</div>';
            }
        }

        function playMp4(source, title, index) {
            const player = document.getElementById('native-video-player');
            const titleEl = document.getElementById('current-video-title');
            if (player) {
                player.src = source;
                player.play();
            }
            if (titleEl) titleEl.innerText = title;

            document.querySelectorAll('.playlist-item').forEach(el => {
                el.classList.remove('bg-rose-600/30', 'border', 'border-rose-500/30');
            });
            const activeItem = document.querySelector(`.playlist-item[data-index="${index}"]`);
            if (activeItem) activeItem.classList.add('bg-rose-600/30', 'border', 'border-rose-500/30');
        }

        // Chess Game Logic
        let chessBoard = [];
        let selectedSquare = null;
        let turn = 'w';
        let chessMode = 'bot';

        function setChessMode(mode) {
            chessMode = mode;
            resetChessGame();
        }

        function resetChessGame() {
            chessBoard = [
                ['r','n','b','q','k','b','n','r'],
                ['p','p','p','p','p','p','p','p'],
                ['','','','','','','',''],
                ['','','','','','','',''],
                ['','','','','','','',''],
                ['','','','','','','',''],
                ['P','P','P','P','P','P','P','P'],
                ['R','N','B','Q','K','B','N','R']
            ];
            turn = 'w';
            selectedSquare = null;
            const status = document.getElementById('chess-status');
            if (status) status.innerText = "White's Turn";
            renderChessBoard();
        }

        const pieceIcons = {
            'r': 'fa-chess-rook', 'n': 'fa-chess-knight', 'b': 'fa-chess-bishop', 'q': 'fa-chess-queen', 'k': 'fa-chess-king', 'p': 'fa-chess-pawn',
            'R': 'fa-chess-rook', 'N': 'fa-chess-knight', 'B': 'fa-chess-bishop', 'Q': 'fa-chess-queen', 'K': 'fa-chess-king', 'P': 'fa-chess-pawn'
        };

        function renderChessBoard() {
            const boardEl = document.getElementById('chess-board');
            if (!boardEl) return;
            boardEl.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const isDark = (r + c) % 2 === 1;
                    const piece = chessBoard[r][c];
                    const isSelected = selectedSquare && selectedSquare.r === r && selectedSquare.c === c;
                    const sq = document.createElement('div');
                    sq.className = `flex items-center justify-center cursor-pointer text-xl sm:text-2xl ${isDark ? 'bg-amber-900/80' : 'bg-amber-100/90'} ${isSelected ? 'ring-2 ring-blue-400' : ''}`;
                    if (piece) {
                        const isWhitePiece = piece === piece.toUpperCase();
                        sq.innerHTML = `<i class="fa-solid ${pieceIcons[piece]} ${isWhitePiece ? 'text-amber-100 drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]' : 'text-gray-950'}"></i>`;
                    }
                    sq.onclick = () => handleSquareClick(r, c);
                    boardEl.appendChild(sq);
                }
            }
        }

        function handleSquareClick(r, c) {
            const piece = chessBoard[r][c];
            const isWhitePiece = piece && piece === piece.toUpperCase();
            const isBlackPiece = piece && piece === piece.toLowerCase();

            if (selectedSquare) {
                if (selectedSquare.r === r && selectedSquare.c === c) {
                    selectedSquare = null;
                } else if ((turn === 'w' && isWhitePiece) || (turn === 'b' && isBlackPiece)) {
                    selectedSquare = { r, c };
                } else {
                    chessBoard[r][c] = chessBoard[selectedSquare.r][selectedSquare.c];
                    chessBoard[selectedSquare.r][selectedSquare.c] = '';
                    selectedSquare = null;

                    if (chessMode === 'human') {
                        turn = turn === 'w' ? 'b' : 'w';
                        const status = document.getElementById('chess-status');
                        if (status) status.innerText = turn === 'w' ? "White's Turn" : "Black's Turn";
                        renderChessBoard();
                    } else {
                        turn = 'b';
                        const status = document.getElementById('chess-status');
                        if (status) status.innerText = "Bot thinking...";
                        renderChessBoard();
                        setTimeout(botMove, 600);
                    }
                    return;
                }
            } else {
                if ((turn === 'w' && isWhitePiece) || (turn === 'b' && isBlackPiece)) {
                    selectedSquare = { r, c };
                }
            }
            renderChessBoard();
        }

        function botMove() {
            let blackPieces = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = chessBoard[r][c];
                    if (p && p === p.toLowerCase()) blackPieces.push({ r, c, p });
                }
            }
            if (blackPieces.length > 0) {
                const randomPiece = blackPieces[Math.floor(Math.random() * blackPieces.length)];
                const targetRow = Math.min(7, randomPiece.r + 1);
                chessBoard[targetRow][randomPiece.c] = randomPiece.p;
                chessBoard[randomPiece.r][randomPiece.c] = '';
            }
            turn = 'w';
            const status = document.getElementById('chess-status');
            if (status) status.innerText = "White's Turn";
            renderChessBoard();
        }

        // Snake Game Logic
        let snakeInterval = null, snakeScore = 0, snakeDir = {x:1, y:0}, snakePos = [{x:10, y:10}], food = {x:5, y:5};
        function startSnakeGame() {
            if (snakeInterval) clearInterval(snakeInterval);
            snakeScore = 0; snakeDir = {x:1, y:0}; snakePos = [{x:10, y:10}, {x:9, y:10}];
            snakeInterval = setInterval(() => {
                const canvas = document.getElementById('snake-canvas');
                if (!canvas) { clearInterval(snakeInterval); return; }
                const ctx = canvas.getContext('2d');
                const head = {x: snakePos[0].x + snakeDir.x, y: snakePos[0].y + snakeDir.y};
                if (head.x < 0 || head.x >= 15 || head.y < 0 || head.y >= 15) { clearInterval(snakeInterval); alert('Game Over!'); return; }
                snakePos.unshift(head);
                if (head.x === food.x && head.y === food.y) {
                    food = {x: Math.floor(Math.random()*15), y: Math.floor(Math.random()*15)};
                } else { snakePos.pop(); }
                ctx.fillStyle = '#000'; ctx.fillRect(0,0,240,240);
                ctx.fillStyle = '#ef4444'; ctx.fillRect(food.x*16, food.y*16, 14, 14);
                ctx.fillStyle = '#10b981';
                snakePos.forEach(p => ctx.fillRect(p.x*16, p.y*16, 14, 14));
            }, 130);
        }

        // Notes Logic
        function updateNotesSidebar() {
            const sidebar = document.getElementById('notes-sidebar');
            if (sidebar) {
                sidebar.innerHTML = notesList.map(n => `
                    <div onclick="selectNote(${n.id})" class="p-1.5 rounded-lg cursor-pointer truncate ${n.id === currentNoteId ? 'bg-blue-600' : 'hover:bg-white/10'}">${n.title}</div>
                `).join('');
            }
        }
        function selectNote(id) {
            currentNoteId = id;
            const note = notesList.find(n => n.id === id);
            if (note) {
                document.getElementById('note-title').value = note.title;
                document.getElementById('note-content').value = note.content;
            }
            updateNotesSidebar();
        }
        function createNewNote() {
            const id = Date.now();
            notesList.push({id, title: 'New Note', content: ''});
            selectNote(id);
        }
        function updateNote() {
            const note = notesList.find(n => n.id === currentNoteId);
            if (note) {
                note.title = document.getElementById('note-title').value;
                note.content = document.getElementById('note-content').value;
                updateNotesSidebar();
            }
        }

        // Calculator Logic
        let calcVal = '0';
        function calcAction(val) {
            const display = document.getElementById('calc-display');
            if (!display) return;
            if (val === 'C') calcVal = '0';
            else if (val === '=') {
                try { calcVal = eval(calcVal.replace('×','*').replace('÷','/')).toString(); } catch { calcVal = 'Error'; }
            } else {
                calcVal = calcVal === '0' ? val : calcVal + val;
            }
            display.innerText = calcVal;
        }

        // Terminal Logic
        function handleTerm(e) {
            if (e.key === 'Enter') {
                const cmd = e.target.value.trim();
                const out = document.getElementById('term-out');
                let res = cmd === 'help' ? 'Commands: help, date, clear' : cmd === 'date' ? new Date().toString() : `zsh: command not found: ${cmd}`;
                out.innerHTML += `<div>$ ${cmd}</div><div class="text-green-300 mb-1">${res}</div>`;
                e.target.value = '';
            }
        }

        function initAppLogic(appName) {
            if (appName === 'chess') resetChessGame();
            if (appName === 'notes') { updateNotesSidebar(); selectNote(currentNoteId); }
            if (appName === 'snake') startSnakeGame();
        }

        function showCustomMessage(msg) {
            alert(msg);
        }

        function restartOS() { location.reload(); }
        function changeBrightness(val) {
            document.getElementById('wallpaper-overlay').style.backgroundColor = `rgba(0,0,0,${(100 - val)/150})`;
        }
    </script>
</body>
</html>
